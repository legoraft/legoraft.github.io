<header>
    <button id="mode-button">
        <span id="mode-icon"></span>
    </button>
    
    <div id="theme" tabindex="0">
        <button class="theme-selector">
            <span class="dot" id="accent"></span>
            <span class="dot" id="foreground"></span>
            <span class="dot" id="surface"></span>
        </button>
        <div class="content">
            <button class="theme-button" name="classic">Classic</button>
            <button class="theme-button" name="nord">Nord</button>
            <button class="theme-button" name="kanagawa">Kanagawa</button>            
            <button class="theme-button" name="gruvbox">Gruvbox</button>
        </div>
    </div>
</header>
